#define DEFENSIVE_SIEGE_MACHINE
    [if]
        [have_location]
            x,y=$x1,$y1
            terrain="K*"
        [/have_location]
        [not]
            [have_location]
                x,y=$x1,$y1
                terrain="K*^V*"
            [/have_location]
        [/not]
        [then]
            [lua]
                code = <<
                    local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
                    local raw_string = "defensive_siege_machine_" .. unit.id
                    local processed_string = raw_string:gsub("[%s-]+", "_")
                    wesnoth.set_variable("objectId", processed_string)
                >>
            [/lua]
            # use a switch statement to give different objects to the unit depending on the keep type

            [if]
                [have_location]
                    x,y=$x1,$y1
                    terrain="Kh*"
                [/have_location]
                [then]
                    [if]
                        [have_unit]
                            x,y=$x1,$y1
                            [filter_wml]
                                [modifications]
                                    [trait]
                                        id=siege_engineer
                                    [/trait]
                                [/modifications]
                            [/filter_wml]
                        [/have_unit]
                        [then]
                            [modify_unit]
                                [filter]
                                    id=$unit.id
                                [/filter]
                                [object]
                                    id=$objectId
                                    silent=yes
                                    duration=scenario
                                    take_only_once=no
                                    [effect]
                                        apply_to=new_attack
                                        name=defensive_siege_weapon
                                        description= _ "Catapult"
                                        icon=attacks/sling.png
                                        type=impact
                                        range=ranged
                                        damage=14
                                        number=3
                                    [/effect]
                                [/object]
                            [/modify_unit]
                        [/then]
                        [else]
                            [modify_unit]
                                [filter]
                                    id=$unit.id
                                [/filter]
                                [object]
                                    id=$objectId
                                    silent=yes
                                    duration=scenario
                                    take_only_once=no
                                    [effect]
                                        apply_to=new_attack
                                        name=defensive_siege_weapon
                                        description= _ "Stone"
                                        icon=attacks/sling.png
                                        type=impact
                                        range=ranged
                                        damage=8
                                        number=3
                                    [/effect]
                                [/object]
                            [/modify_unit]
                        [/else]
                    [/if]
                [/then]
                [elseif]
                     [have_location]
                        x,y=$x1,$y1
                        terrain="Ko*"
                    [/have_location]
                    [then]
                        [if]
                            [have_unit]
                                x,y=$x1, $y1
                                [filter_wml]
                                    [modifications]
                                        [trait]
                                            id=siege_engineer
                                        [/trait]
                                    [/modifications]
                                [/filter_wml]
                            [/have_unit]
                            [then]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "Ballista"
                                            icon=attacks/ballista.png
                                            type=pierce
                                            range=ranged
                                            damage=21
                                            number=2
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/then]
                            [else]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "Crossbows"
                                            icon=attacks/crossbow-orcish.png
                                            type=pierce
                                            range=ranged
                                            damage=12
                                            number=2
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/else]
                        [/if]      
                    [/then]
                [/elseif]
                [elseif]
                    [have_location]
                        x,y=$x1,$y1
                        terrain="Kv*"
                    [/have_location]
                    [then]
                        [if]
                            [have_unit]
                                 x,y=$x1, $y1
                                [filter_wml]
                                    [modifications]
                                        [trait]
                                            id=siege_engineer
                                        [/trait]
                                    [/modifications]
                                [/filter_wml]
                            [/have_unit]
                            [then]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=attack
                                            range=ranged
                                            set_name=defensive_siege_weapon
                                            [set_specials]
                                                mode=append
                                                [chance_to_hit]
                                                    add=20
                                                [/chance_to_hit]
                                            [/set_specials]
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/then]
                            [else]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=attack
                                            range=ranged
                                            set_name=defensive_siege_weapon
                                            [set_specials]
                                                mode=append
                                                [chance_to_hit]
                                                    add=10
                                                [/chance_to_hit]
                                            [/set_specials]
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/else]
                        [/if]
                    [/then]
                [/elseif]
                [elseif]
                    [have_location]
                        x,y=$x1,$y1
                        terrain="Kd*"
                    [/have_location]
                    [then]
                        [if]
                            [have_unit]
                                 x,y=$x1, $y1
                                [filter_wml]
                                    [modifications]
                                        [trait]
                                            id=siege_engineer
                                        [/trait]
                                    [/modifications]
                                [/filter_wml]
                            [/have_unit]
                            [then]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "Boiling Oil"
                                            icon=attacks/boiling_oil.png
                                            type=fire
                                            range=ranged
                                            damage=42
                                            number=1
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/then]
                            [else]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "Boiling Oil"
                                            icon=attacks/boiling_oil.png
                                            type=fire
                                            range=ranged
                                            damage=24
                                            number=1
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/else]
                        [/if]  
                    [/then]
                [/elseif]
                [elseif]
                    #  Dwarven Keep variants
                    [have_location]
                        x,y=$x1,$y1
                        terrain="Kf*, Ku*"
                    [/have_location]
                    [then]
                        [if]
                            [have_unit]
                                 x,y=$x1, $y1
                                [filter_wml]
                                    [modifications]
                                        [trait]
                                            id=siege_engineer
                                        [/trait]
                                    [/modifications]
                                [/filter_wml]
                            [/have_unit]
                            [then]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "cannon"
                                            icon=attacks/thunderstick.png
                                            type=pierce
                                            range=ranged
                                            damage=22
                                            number=2
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/then]
                            [else]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "grenade"
                                            icon=attacks/magic-missile.png
                                            type=fire
                                            range=ranged
                                            damage=19
                                            number=1
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/else]
                        [/if]  
                    [/then]
                [/elseif]
                [elseif]
                    #  human encampment tower
                    [have_location]
                        x,y=$x1,$y1
                        terrain="Ket"
                    [/have_location]
                    [then]
                        [if]
                            [have_unit]
                                 x,y=$x1, $y1
                                [filter_wml]
                                    [modifications]
                                        [trait]
                                            id=siege_engineer
                                        [/trait]
                                    [/modifications]
                                [/filter_wml]
                            [/have_unit]
                            [then]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "bow"
                                            icon=attacks/bow-short.png
                                            type=pierce
                                            range=ranged
                                            damage=6
                                            number=5
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/then]
                            [else]
                                [modify_unit]
                                    [filter]
                                        id=$unit.id
                                    [/filter]
                                    [object]
                                        id=$objectId
                                        silent=yes
                                        duration=scenario
                                        take_only_once=no
                                        [effect]
                                            apply_to=new_attack
                                            name=defensive_siege_weapon
                                            description= _ "javelin"
                                            icon=attacks/javelin-human.png
                                            type=pierce
                                            range=ranged
                                            damage=9
                                            number=2
                                        [/effect]
                                    [/object]
                                [/modify_unit]
                            [/else]
                        [/if]  
                    [/then]
                [/elseif]
            [/if]
            [clear_variable]
                name=objectId
            [/clear_variable]
        [/then]
    [/if]
#enddef



#define REMOVE_DEFENSIVE_SIEGE_MACHINE
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "defensive_siege_machine_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [remove_object]
        [filter]
            x,y=$x1,$y1
        [/filter]
        object_id=$objectId
    [/remove_object]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef