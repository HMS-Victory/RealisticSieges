#define EQUIP_LADDERS_MENU_ITEM
[set_menu_item]
    id=grant_ladder_ability
    description=_ "Equip unit with ladders (cost: 6g)"
    [show_if]
        [have_unit]
            x,y=$x1,$y1
            [not]
                [filter_wml]
                    [variables]
                        hasLadder=yes
                    [/variables]
                [/filter_wml]  
            [/not]
            [not]
                [filter_wml]  
                    [variables]
                        cannot_fly=no 
                    [/variables]
                [/filter_wml]
            [/not]
        [/have_unit]    

        [have_location]
            x,y=$x1,$y1

            [not]
                terrain=C*,K*
            [/not]
            # Selected tile must be adjacent to a leader on wooden castle
            [filter_adjacent_location]
                [filter]
                    side=$side_number
                    canrecruit=yes

                    [filter_location]
                        terrain=Ce*^*
                    [/filter_location]
                [/filter]
            [/filter_adjacent_location]
        [/have_location] 
        #  only show up if there is a unit already standing on this tile
    [/show_if]
    [command]
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]

            [set_variable]
                name=hasLadder
                value=yes 
            [/set_variable]
        [/modify_unit]
        [gold]
            side=$side_number
            amount=-6
        [/gold]
        {REMOVE_ELEVATOR_COSTS}
        {REMOVE_RAMPART_COSTS}
        {REMOVE_GROUND_COSTS} 
        {APPLY_LADDER_TO_WALLS} 
        {castleZOC_OFF}
        {RESTORE_MOVES} 
    [/command]
[/set_menu_item]
#enddef


#define DROP_LADDERS_MENU_ITEM
[set_menu_item]
    id=remove_ladder_ability
    description=_ "Drop Ladders"
    [show_if]
        #  only show up if there is a unit already standing on this tile
        [have_unit]
            x,y=$x1,$y1
            [filter_wml]
                [variables]
                    hasLadder=yes
                [/variables]
            [/filter_wml]
        [/have_unit] 
    [/show_if] 
    [command]
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]  
            [clear_variable]
                name=hasLadder
            [/clear_variable]
        [/modify_unit]
        #  make sure we set movement costs to the terrain we currently stand on
        [if]
            [have_location]
                x,y=$x1,$y1
                terrain="C*,K*"
            [/have_location]
            [then]
                {castleZOC_ON}
                {REMOVE_LADDER}
                {REMOVE_GROUND_COSTS}
                {REMOVE_ELEVATOR_COSTS}
                {APPLY_RAMPART_COSTS}                
                {DEFENSIVE_SIEGE_MACHINE}
                {RESTORE_MOVES}
            [/then]
            [elseif]
                [have_location]
                    x,y=$x1,$y1
                    terrain="K*^V*, C*^V*, Chg^*"
                [/have_location]
                [then]
                    {REMOVE_LADDER}
                    {castleZOC_OFF}
                    {REMOVE_GROUND_COSTS}
                    {REMOVE_RAMPART_COSTS}
                    {APPLY_ELEVATOR_COSTS}
                    {RESTORE_MOVES}
                [/then]
            [/elseif]
            [else]
                {REMOVE_LADDER}
                {REMOVE_ELEVATOR_COSTS}
                {REMOVE_RAMPART_COSTS}
                {APPLY_GROUND_COSTS}
                {castleZOC_OFF}
                {RESTORE_MOVES}
            [/else]
        [/if]
    [/command]
[/set_menu_item]
#enddef