#define APPLY_CASTLE_MELEE
    [modify_unit]
        [filter]
            id=$unit.id
        [/filter]
        [object]
            id=disabled_melee_object
            [effect]
                apply_to=attack
                range=melee
                [set_specials]
                    mode=append
                    {WEAPON_SPECIAL_CASTLE_DISABLE_MELEE}
                [/set_specials]
            [/effect]
        [/object]
    [/modify_unit]
#enddef



#define WEAPON_SPECIAL_CASTLE_DISABLE_MELEE
    
    [disable]
        id=castle_disable_melee
        active_on=offense
        apply_to=both
        [filter_opponent]
            [filter_location]
                terrain=C*,K*, C*^*, K*^*
            [/filter_location]
        [/filter_opponent]
        [filter_self]
            [not]
                [filter_location]
                    terrain=C*,K*, C*^*, K*^*
                [/filter_location]
            [/not]
        [/filter_self]
    [/disable]
    [disable]
        id=castle_disable_melee
        active_on=offense
        apply_to=both
        [filter_self]
            [filter_location]
                terrain=C*,K*, C*^*, K*^*
            [/filter_location]
        [/filter_self]
        [filter_opponent]
            [not]
                [filter_location]
                    terrain=C*,K*, C*^*, K*^*
                [/filter_location]
            [/not]
        [/filter_opponent]
    [/disable]
#enddef