#define APPLY_GROUND_COSTS
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "groundCosts_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [object]
        id=$objectId
        take_only_once=no
        silent=yes
        duration=scenario
        [filter]
            x,y=$x1,$y1
        [/filter]
        [effect]
            apply_to=movement_costs
            replace=yes
            [movement_costs]
                castle=99
            [/movement_costs]
        [/effect]
    [/object]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef

#define REMOVE_GROUND_COSTS
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "groundCosts_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [remove_object]
        [filter]
            x,y=$x1,$y1
        [/filter]
        object_id=$objectId
    [/remove_object]
    [modify_unit]
        [filter]
            id=$unit.id
        [/filter]
        [rebuild]
        [/rebuild]
    [/modify_unit]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef