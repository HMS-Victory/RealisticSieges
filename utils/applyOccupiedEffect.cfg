#define APPLY_OCCUPIED_EFFECT DURATION
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "occupied_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [object]
        id=$objectId
        [filter]
            x,y=$x1,$y1
        [/filter]
        duration=turns
        turns={DURATION}
        [effect]
            apply_to=movement
            set=0
        [/effect]
        [effect]
            apply_to=attack
            set_attacks_left=0
        [/effect]
    [/object]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef

#define CLEAR_OCCUPIED_EFFECT
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "occupied_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [remove_object]
        [filter]
            x,y=$x1,$y1
        [/filter]
        object_id=$objectId
    [/remove_object]
    [modify_unit]
        [filter]
            x,y=$x1,$y1
        [/filter]
        [rebuild]
        [/rebuild]
    [/modify_unit]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef