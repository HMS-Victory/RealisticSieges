    #  TODO:
    #  It might be cool to have ladders, and mining equipment be purchased through a recruit menu like the one
    #  that I am already using to recruit siege equipment, this would look a little less modded, and I think would
    #  add to the overall quality of the mod

#define RECRUIT_SIEGE_MACHINES_ITEM
[set_menu_item]
    id=recruit_siege_machine
    description= _ "Recruit Siege Machine" 

    [show_if]
        [not]
            [have_unit]
                x,y=$x1,$y1
            [/have_unit]
        [/not]
        [have_location]
            x,y=$x1,$y1

            # Selected tile must NOT be castle or keep
            [not]
                terrain=C*,K*
            [/not]

            # Selected tile must be adjacent to a leader on wooden castle
            [filter_adjacent_location]
                [filter]
                    side=$side_number
                    canrecruit=yes

                    [filter_location]
                        terrain=Ce*^*
                    [/filter_location]
                [/filter]
            [/filter_adjacent_location]
        [/have_location]
    [/show_if]

    [command]
        [RSM_recruit]
            list = "SM_Catapult,SM_Battering_Ram"
            to=chosenUnit
        [/RSM_recruit]
        [if]
            [variable]
                name=chosenUnit
                exists=yes
            [/variable]
            [not]
                [variable]
                    name=chosenUnit
                    equals=""
                [/variable]
            [/not]
            [then] 
                {RSM_MANUAL_RECRUIT $chosenUnit $side_number $x1 $y1}
            [/then]
        [/if]
        [clear_variable]
            name=chosenUnit
        [/clear_variable]
    [/command]
[/set_menu_item]
#enddef