[binary_path]
   path=data/add-ons/Siege_Mod/
[/binary_path]
[textdomain]
    name="wesnoth-Siege_Mod"
    path="data/add-ons/Siege_Mod/translations"
[/textdomain]

#ifdef MULTIPLAYER
{~add-ons/Siege_Mod/images/terrain/gateStone/}
{~add-ons/Siege_Mod/images/terrain/bridgeStone}
{~add-ons/Siege_Mod/utils/}
{~add-ons/Siege_Mod/macros/}
{~add-ons/Siege_Mod/images/units/}
[+units]
    {~add-ons/Siege_Mod/units/}
[/units]


[lua]
    code = <<
        wesnoth.dofile("~add-ons/Siege_Mod/utils/lua/RSM_recruit.lua")
        wesnoth.dofile("~add-ons/Siege_Mod/utils/lua/RSM_knockback.lua")
    >>
[/lua]


#textdomain wesnoth-Siege_Mod
[modification]
    id=Siege_Mod  
    name=_ "Realistic Sieges"
    type=hybrid
    require_modification=yes
    description=_ "Applies real life principles like height to prevent soldiers outside a castle from just attacking the defenders with melee"



    [event] 
        name=prestart
        [set_menu_item]
            id=your_option_id
            description= _ "Recruit Siege Machine" 

            [show_if]
                [have_location]
                    x,y=$x1,$y1

                    # Selected tile must NOT be castle or keep
                    [not]
                        terrain=C*,K*
                    [/not]

                    # Selected tile must be adjacent to a leader on wooden castle
                    [filter_adjacent_location]
                        [filter]
                            side=$side_number
                            canrecruit=yes

                            [filter_location]
                                terrain=Ce*^*
                            [/filter_location]
                        [/filter]
                    [/filter_adjacent_location]
                [/have_location]
            [/show_if]

            [command]
                [RSM_recruit]
                    list = "SM_Catapult,SM_Battering_Ram"
                    to=chosenUnit
                [/RSM_recruit]
                [if]
                    [variable]
                        name=chosenUnit
                        exists=yes
                    [/variable]
                    [not]
                        [variable]
                            name=chosenUnit
                            equals=""
                        [/variable]
                    [/not]
                    [then] 
                        {RSM_MANUAL_RECRUIT $chosenUnit $side_number $x1 $y1}
                    [/then]
                [/if]
                [clear_variable]
                    name=chosenUnit
                [/clear_variable]
            [/command]
        [/set_menu_item]
        [set_menu_item]
            id=grant_ladder_ability
            description=_ "Equip unit with ladders (cost: 6g)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    [not]
                        [filter_wml]
                            [variables]
                                hasLadder=yes
                            [/variables]
                        [/filter_wml]  
                    [/not]
                    [not]
                        [filter_wml]  
                            [variables]
                                cannot_fly=no 
                            [/variables]
                        [/filter_wml]
                    [/not]
                [/have_unit]    

                [have_location]
                    x,y=$x1,$y1
 
                    [not]
                        terrain=C*,K*
                    [/not]
                    #  [have_unit]
                    #      x,y=$x1,$y1
                        
                    #      [filter_wml]

                    #          formula="unit.variables.hasLadder != yes"  
                    #      [/filter_wml]
                        
                        
                    #      #  formula="self.wml_vars.hasLadder != 'yes'"  
                    #      #  formula = "(self.movement_cost.unwalkable = null or self.movement_cost.unwalkable > self.max_moves) and self.variables.hasLadder != 'yes'" 
 
                    #  [/have_unit] 
                    #  [have_unit]
                    #      x,y=$x1, $y1
                    
                    #  [/have_unit]

                    # Selected tile must be adjacent to a leader on wooden castle
                    [filter_adjacent_location]
                        [filter]
                            side=$side_number
                            canrecruit=yes

                            [filter_location]
                                terrain=Ce*^*
                            [/filter_location]
                        [/filter]
                    [/filter_adjacent_location]
                [/have_location] 
                #  only show up if there is a unit already standing on this tile
            [/show_if]
            [command]
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]

                    [set_variable]
                        name=hasLadder
                        value=yes 
                    [/set_variable]
                [/modify_unit]
                [gold]
                    side=$side_number
                    amount=-6
                [/gold]
                {REMOVE_ELEVATOR_COSTS}
                {REMOVE_RAMPART_COSTS}
                {REMOVE_GROUND_COSTS} 
                {APPLY_LADDER_TO_WALLS} 
                {castleZOC_OFF}
                {RESTORE_MOVES} 
            [/command]
        [/set_menu_item]
        [set_menu_item]
            id=remove_ladder_ability
            description=_ "Drop Ladders"
            [show_if]
                #  only show up if there is a unit already standing on this tile
                [have_unit]
                    x,y=$x1,$y1
                    [filter_wml]
                        [variables]
                            hasLadder=yes
                        [/variables]
                    [/filter_wml]
                [/have_unit] 
            [/show_if] 
            [command]
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]  
                    [set_variable]
                        name=hasLadder
                        value=no
                    [/set_variable]
                [/modify_unit]
                #  make sure we set movement costs to the terrain we currently stand on
                [if]
                    [have_location]
                        x,y=$x1,$y1
                        terrain="C*,K*"
                    [/have_location]
                    [then]
                        {castleZOC_ON}
                        {REMOVE_LADDER}
                        {REMOVE_GROUND_COSTS}
                        {REMOVE_ELEVATOR_COSTS}
                        {APPLY_RAMPART_COSTS}                
                        {DEFENSIVE_SIEGE_MACHINE}
                        {RESTORE_MOVES}
                    [/then]
                    [elseif]
                        [have_location]
                            x,y=$x1,$y1
                            terrain="K*^V*, C*^V*, Chg^*"
                        [/have_location]
                        [then]
                            {REMOVE_LADDER}
                            {castleZOC_OFF}
                            {REMOVE_GROUND_COSTS}
                            {REMOVE_RAMPART_COSTS}
                            {APPLY_ELEVATOR_COSTS}
                            {RESTORE_MOVES}
                        [/then]
                    [/elseif]
                    [else]
                        {REMOVE_LADDER}
                        {REMOVE_ELEVATOR_COSTS}
                        {REMOVE_RAMPART_COSTS}
                        {APPLY_GROUND_COSTS}
                        {castleZOC_OFF}
                        {RESTORE_MOVES}
                    [/else]
                [/if]
            [/command]
        [/set_menu_item]
    [/event]

    [event]
        name=exit_hex
        first_time_only=no
        #  this is meant to inform the restoreOriginalMoves macro
        #  each time a unit exits a hex we store it's current remaining moves-1
        #  of course depending on the terrain the unit steps on this is likely to be inacurate most of the time
        #  but since this is only implemented when a unit's movetype changes, and that particular terrain
        #  costs 1 movepoint regardless then when we actually use this variable it will be completely accurate.
        [set_variable]
            name=remaining_moves
            value="$($unit.moves - 1)"
        [/set_variable]
    [/event]

    #  #  fires when a unit teleports
    [event]
        name=enter_hex
        first_time_only=no
        [filter_condition]
            [have_location]
                x,y=$x2,$y2
                terrain=*^Tnl*
                [not]
                    [filter_adjacent_location]
                        x,y=$x1,$y1
                    [/filter_adjacent_location]
                [/not]
            [/have_location]
        [/filter_condition] 
            [modify_unit]
                [filter]
                    id=$unit.id
                [/filter]
                moves="$($unit.moves - 5)"
            [/modify_unit] 
    [/event]  

    [event]
        name=moveto
        first_time_only=no
        #  don't do anything at all to flying units
        [filter]
            [and]
                [filter_location]
                    x,y=$x1,$y1
                [/filter_location]

                formula = "self.movement_cost.unwalkable = null or self.movement_cost.unwalkable > self.max_moves" 
            [/and]
        [/filter]

        #  if standing on an elevator - grant elevator costs
        #  if standing on a rampart - grant rampart costs
        #  if standing on the ground grant ground costs
        [if]
            #  if the terrain is any type of castle
            [have_location]
                x,y=$x1,$y1
                terrain="C*,K*, K*^V*, C*^V*"
            [/have_location]
            [then]
                {HANDLE_WALL_LOGIC}
            [/then]
            [elseif]
                [have_location]
                    x,y=$x1,$y1
                    terrain="*^Tnl"
                [/have_location]
                [then]
                    #  only make changes because of the base terrain under the ^Tnl
                [/then]
            [/elseif] 
            [else]
                {HANDLE_GROUND_LOGIC}
            [/else]
        [/if]
        
        [clear_variable]
            name=remaining_moves
        [/clear_variable]
    [/event]



    #  do this for any unit anywhere, except for siege machines
    [event]
        name=unit_placed
        first_time_only=no
        [filter]
            x,y=$x1,$y1
            [not]
                race=mechanical
            [/not]
        [/filter]
        {APPLY_TUNNELING}
        #  {HANDLE_GATE_MOVEMENT}
    [/event]

    [event]
        name=unit_placed
        first_time_only=no
        [filter]
            [and]
                [filter_location]
                    x,y=$x1,$y1
                [/filter_location]

                [not]
                    [filter_wml]
                        [variables]
                            placed_first_time=yes 
                        [/variables] 
                    [/filter_wml]
                [/not]
                formula = "self.movement_cost.unwalkable = null or self.movement_cost.unwalkable > self.max_moves" 
            [/and]  
        [/filter]      
        
        [if]
            #  if the terrain is any type of castle
            [have_location]
                x,y=$x1,$y1
                terrain="C*,K*,K*^V*"
            [/have_location]
            
            [then]
                #  if the unit is both standing on the castle and can't fly
                {HANDLE_WALL_LOGIC}
                [if]
                    [have_unit]
                        x,y=$x1,$y1
                        [not]
                            type=SM_Catapult,SM_Battering_Ram
                        [/not]
                    [/have_unit]
                    [then]
                        {APPLY_CASTLE_MELEE}
                    [/then]
                [/if]
            [/then] 
            [elseif]
                [have_location]
                    x,y=$x1,$y1
                    terrain="*^Tnl"
                [/have_location]
                [then]
                    #  only make changes because of the base terrain under the ^Tnl
                [/then]
            [/elseif]  
            [else]
                {HANDLE_GROUND_LOGIC}
            [/else]
        [/if]
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            [set_variable]
                name=placed_first_time
                value=yes
            [/set_variable]
            [set_variable]
                name=max_moves
                value=$unit.max_moves
            [/set_variable]
            [set_variable]
                name=cannot_fly
                value=yes
            [/set_variable]
        [/modify_unit]
    [/event]

    [event]
        name=recruit
        first_time_only=no
        [filter]
            x,y=$x1,$y1
            [not]
                race=undead
            [/not] 
            [not]
                race=mechanical
            [/not]
        [/filter]
        {ADD_ENGINEER_TRAIT_TO_RECRUITED}
        [modify_unit]
            [filter]
                x,y=$x1,$y1
                formula = "self.movement_cost.unwalkable != null and self.movement_cost.unwalkable < self.max_moves"
            [/filter]
            [set_variable]
                name=cannot_fly
                value=no
            [/set_variable] 
        [/modify_unit]
    [/event]

    [event]
        name=attack end
        first_time_only=no

        [filter_attack]
            special_id=knockback
        [/filter_attack]
        [knockback]
            [filter]
                find_in=second_unit
            [/filter]
            [filter_second]
                find_in=unit
            [/filter_second]
        [/knockback]
    [/event]

[/modification]
#endif

#ifdef EDITOR
[binary_path]
   path=data/add-ons/Siege_Mod/
[/binary_path]
    {~add-ons/Siege_Mod/images/terrain/gateStone/}
    {~add-ons/Siege_Mod/images/terrain/bridgeStone/}
    {~add-ons/Siege_Mod/utils/}
#endif







