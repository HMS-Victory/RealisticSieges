#define APPLY_LADDER_TO_WALLS
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "ladderCosts_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [lua]
        code=<<
            local u = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local ladder_moves = u.variables.max_moves / 2 +1
            wesnoth.set_variable("moves", ladder_moves)
        >>
    [/lua]
    [object]
        id=$objectId
        take_only_once=no
        silent=yes
        duration=scenario
        [filter] 
            x,y=$x1,$y1
        [/filter]
        
        [effect]
            apply_to=movement
            set=$moves
        [/effect]
        [effect]
            apply_to=movement_costs
            replace=yes
            [movement_costs]
                castle=$moves
            [/movement_costs]
        [/effect]
    [/object]
    [clear_variable]
        name=moves
    [/clear_variable]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef

#define APPLY_LADDER_TO_GROUND
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "ladderCosts_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [lua]
        code=<<
            local u = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local ladder_moves = u.variables.max_moves / 2 +1
            wesnoth.set_variable("moves", ladder_moves)
        >>
    [/lua]
    [object] 
        id=$objectId
        take_only_once=no
        silent=yes
        duration=scenario
        [filter]
            x,y=$x1,$y1 
        [/filter]
        [effect]
            apply_to=movement
            set=$moves
        [/effect]
        [effect]
            apply_to=movement_costs
            replace=yes
            [movement_costs]
                deep_water=99
                shallow_water=$moves
                reef=$moves
                swamp_water=$moves
                flat=$moves
                sand=$moves
                forest=$moves
                hills=$moves
                mountains=$moves
                village=$moves
                cave=$moves
                frozen=$moves
                unwalkable=99
                impassable=99 
            [/movement_costs]
        [/effect]
    [/object]
    [clear_variable]
        name=moves
    [/clear_variable]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef

#define REMOVE_LADDER
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "ladderCosts_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [remove_object]
        [filter]
            x,y=$x1,$y1
        [/filter]
        object_id=$objectId
    [/remove_object]
    [modify_unit]
        [filter]
            id=$unit.id
        [/filter]
        [rebuild]
        [/rebuild]
    [/modify_unit]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef