[binary_path]
   path=data/add-ons/Siege_Mod/
[/binary_path]
[textdomain]
    name="wesnoth-Siege_Mod"
    path="data/add-ons/Siege_Mod/translations"
[/textdomain]

#ifdef MULTIPLAYER
{~add-ons/Siege_Mod/images/terrain/gateStone/}
{~add-ons/Siege_Mod/images/terrain/bridgeStone}
{~add-ons/Siege_Mod/utils/}
{~add-ons/Siege_Mod/utils/menu_items}
{~add-ons/Siege_Mod/macros/}
{~add-ons/Siege_Mod/images/units/}
[+units]
    {~add-ons/Siege_Mod/units/}
[/units]


[lua]
    code = <<
        wesnoth.dofile("~add-ons/Siege_Mod/utils/lua/RSM_recruit.lua")
        wesnoth.dofile("~add-ons/Siege_Mod/utils/lua/RSM_knockback.lua")
    >>
[/lua]


#textdomain wesnoth-Siege_Mod
[modification]
    id=Siege_Mod  
    name=_ "Realistic Sieges"
    type=hybrid
    require_modification=yes
    description=_ "Applies real life principles like height to prevent soldiers outside a castle from just attacking the defenders with melee"

    [event]
        name=preload
        first_time_only=no
 
        [lua] 
            code=<<
                local old_on_mouse_move = wesnoth.game_events.on_mouse_move
                local last_x, last_y = nil, nil
                
                
                local hover_halo = "halo/teleport-1.png:100,halo/teleport-2.png:100,halo/teleport-3.png:100,halo/teleport-4.png:100,halo/teleport-5.png:100,halo/teleport-6.png:100,halo/teleport-7.png:100,halo/teleport-8.png:100,halo/teleport-9.png:100"


                local function should_show_halo(x, y)

                    local selectedUnit = wesnoth.interface.get_displayed_unit() 
                    local hoveredUnit = wesnoth.units.get(x, y) 

                    -- the only case we would ever want to show the halo depends on a unit being selected
                    if selectedUnit == nil or (selectedUnit.x == x and selectedUnit.y == y) then
                        return false
                    end 

                    local rampartCosts = ("rampartCosts_" .. selectedUnit.id) 
                    local groundCosts = ("groundCosts_" .. selectedUnit.id)
                    local elevatorCosts = ("elevatorCosts_" .. selectedUnit.id)
                    local terrain = wesnoth.current.map[{x, y}]   
                    local pathToHovered, cost = wesnoth.paths.find_path(selectedUnit, x, y)  


                    if  selectedUnit.variables.currentMoveCosts == rampartCosts or selectedUnit.variables.currentMoveCosts == groundCosts then 
                        if (terrain:match("^K") and terrain:match("%^V")) or terrain:match("^Chg") then 

                            local reachable = pathToHovered and cost <= selectedUnit.moves

                            return reachable 
                        end

                    elseif selectedUnit.variables.currentMoveCosts == elevatorCosts then 

                        if (not terrain:match("^K.*%^V.*$") and not terrain:match("^Chg%^.*$")) and selectedUnit:movement_on(terrain) <= selectedUnit.max_moves then
                            
                            local reachable = pathToHovered and cost <= selectedUnit.moves

                            return reachable
                        end 

                    end
                    return false 


                    -- basically everything is working except this, so I think it is time to introduce the siege tower
                    -- this matters mainly just for when we hover over a siege tower
                    --local unit = wesnoth.units.get(x, y)
                    --if unit and selectedUnit.side == wesnoth.current.side and  selectedUnit.side == unit.side then
                    --    return true
                    --end 
                end

                wesnoth.game_events.on_mouse_move = function(x, y)
                    if old_on_mouse_move then
                        old_on_mouse_move(x, y)
                    end

                    -- Remove the halo from the previous hex if we moved off it
                    if last_x and last_y then
                        if last_x ~= x or last_y ~= y then
                            wesnoth.interface.remove_hex_overlay(last_x, last_y, hover_halo)
                            last_x, last_y = nil, nil
                        else
                            return -- Still on the same hex, do nothing
                        end
                    end

                    -- Add the halo to the new hex if it matches the condition
                    if (x > 0 and y > 0) and (x <= (wesnoth.current.map.width-2) and y <= (wesnoth.current.map.height - 2)) and should_show_halo(x, y) then
                        wesnoth.interface.add_hex_overlay(x, y, {  
                            halo = hover_halo
                        }) 
                        last_x, last_y = x, y
                    end
                end
            >>
        [/lua]
    [/event]

    [event] 
        name=prestart
        {RECRUIT_SIEGE_MACHINES_ITEM}
        {EQUIP_LADDERS_MENU_ITEM}
        {DROP_LADDERS_MENU_ITEM}
        {BUILD_SIEGE_CAMP_MENU_ITEM}
        {EQUIP_MINING_GEAR_MENU_ITEM}
        {DROP_MINING_GEAR_MENU_ITEM}
        {START_MINING_MENU_ITEM}
        {STOP_MINING_MENU_ITEM}
    [/event]

    [event]
        name=new turn
        first_time_only=no

        {HANDLE_OCCUPIED_UNITS}
    [/event]


    [event]
        name=exit_hex
        first_time_only=no
        #  this is meant to inform the restoreOriginalMoves macro
        #  each time a unit exits a hex we store it's current remaining moves-1
        #  of course depending on the terrain the unit steps on this is likely to be inacurate most of the time
        #  but since this is only implemented when a unit's movetype changes, and that particular terrain
        #  costs 1 movepoint regardless then when we actually use this variable it will be completely accurate.
        [set_variable]
            name=remaining_moves
            value="$($unit.moves - 1)"
        [/set_variable]
    [/event]

    #  #  fires when a unit teleports
    [event]
        name=enter_hex
        first_time_only=no
        [filter_condition]
            [have_location]
                x,y=$x2,$y2
                terrain=*^Tnl*
                [not]
                    [filter_adjacent_location]
                        x,y=$x1,$y1
                    [/filter_adjacent_location]
                [/not]
            [/have_location]
        [/filter_condition] 
            [modify_unit]
                [filter]
                    id=$unit.id
                [/filter]
                moves="$($unit.moves - 5)"
            [/modify_unit] 
    [/event]  

    [event]
        name=moveto
        first_time_only=no
        #  don't do anything at all to flying units
        [filter]
            [and]
                [filter_location]
                    x,y=$x1,$y1
                [/filter_location]

                formula = "self.movement_cost.unwalkable = null or self.movement_cost.unwalkable > self.max_moves" 
            [/and]
        [/filter]

        #  if standing on an elevator - grant elevator costs
        #  if standing on a rampart - grant rampart costs
        #  if standing on the ground grant ground costs
        [if]
            #  if the terrain is any type of castle
            [have_location]
                x,y=$x1,$y1
                terrain="C*,K*, K*^V*, C*^V*"
            [/have_location]
            [then]
                {HANDLE_WALL_LOGIC}
            [/then]
            [elseif]
                [have_location]
                    x,y=$x1,$y1
                    terrain="*^Tnl"
                [/have_location]
                [then]
                    #  only make changes because of the base terrain under the ^Tnl
                [/then]
            [/elseif] 
            [else]
                {HANDLE_GROUND_LOGIC}
            [/else]
        [/if]
        
        [clear_variable]
            name=remaining_moves
        [/clear_variable]
    [/event]



    #  do this for any unit anywhere, except for siege machines
    [event]
        name=unit_placed
        first_time_only=no
        [filter]
            x,y=$x1,$y1
            [not]
                race=mechanical
            [/not]
        [/filter]
        {APPLY_TUNNELING}
        #  {HANDLE_GATE_MOVEMENT}
    [/event]

    [event]
        name=unit_placed
        first_time_only=no
        [filter]
            [and]
                [filter_location]
                    x,y=$x1,$y1
                [/filter_location]

                [not]
                    [filter_wml]
                        [variables]
                            placed_first_time=yes 
                        [/variables] 
                    [/filter_wml]
                [/not]
                formula = "self.movement_cost.unwalkable = null or self.movement_cost.unwalkable > self.max_moves" 
            [/and]  
        [/filter]      
        
        [if]
            #  if the terrain is any type of castle
            [have_location]
                x,y=$x1,$y1
                terrain="C*,K*,K*^V*"
            [/have_location]
            
            [then]
                #  if the unit is both standing on the castle and can't fly
                {HANDLE_WALL_LOGIC}
                [if]
                    [have_unit]
                        x,y=$x1,$y1
                        [not]
                            type=SM_Catapult,SM_Battering_Ram
                        [/not]
                    [/have_unit]
                    [then]
                        {APPLY_CASTLE_MELEE}
                    [/then]
                [/if]
            [/then] 
            [elseif]
                [have_location]
                    x,y=$x1,$y1
                    terrain="*^Tnl"
                [/have_location]
                [then]
                    #  only make changes because of the base terrain under the ^Tnl
                [/then]
            [/elseif]  
            [else]
                {HANDLE_GROUND_LOGIC}
            [/else]
        [/if]
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            [set_variable]
                name=placed_first_time
                value=yes
            [/set_variable]
            [set_variable]
                name=max_moves
                value=$unit.max_moves
            [/set_variable]
            [set_variable]
                name=cannot_fly
                value=yes
            [/set_variable]
        [/modify_unit]
    [/event]

    [event]
        name=recruit
        first_time_only=no
        [filter]
            x,y=$x1,$y1
            [not]
                race=undead
            [/not] 
            [not]
                race=mechanical
            [/not]
        [/filter]
        {ADD_ENGINEER_TRAIT_TO_RECRUITED}
        [modify_unit]
            [filter]
                x,y=$x1,$y1
                formula = "self.movement_cost.unwalkable != null and self.movement_cost.unwalkable < self.max_moves"
            [/filter]
            [set_variable]
                name=cannot_fly
                value=no
            [/set_variable] 
        [/modify_unit]
    [/event]

    [event]
        name=attack end
        first_time_only=no

        [filter_attack]
            special_id=knockback
        [/filter_attack]
        [knockback]
            [filter]
                find_in=second_unit
            [/filter]
            [filter_second]
                find_in=unit
            [/filter_second]
        [/knockback]
    [/event]

    [event]
        name=die

        [filter]
            ability=vehicle
        [/filter]

        [foreach]
            array=unit.variables.occupant
            variable=unit

            [do]
                [unstore_unit]
                    variable=unit
                    x,y=$x1,$y1
                    find_vacant=yes
                [/unstore_unit]

                [kill]
                    id=$unit.id
                    animate=no
                    fire_event=yes
                [/kill]
            [/do]
        [/foreach]

    [/event]

[/modification]
#endif

#ifdef EDITOR
