#define EQUIP_MINING_GEAR_MENU_ITEM
[set_menu_item]
    id=equip_mining_gear
    description=_ "Equip Mining Gear (Cost: 8g)"
    [show_if]
        [have_unit]
            x,y=$x1,$y1
            [filter_wml]
                [modifications]
                    [trait]
                        id=siege_engineer
                    [/trait]
                [/modifications]
            [/filter_wml]
            [not]
                [filter_wml]
                    [variables]
                        carrying_mining_equipment=yes
                    [/variables]
                [/filter_wml]  
            [/not]
            [not]
                [filter_wml]  
                    [variables]
                        cannot_fly=no 
                    [/variables]
                [/filter_wml]
            [/not]
        [/have_unit]
        [have_location]
            x,y=$x1,$y1

            # Selected tile must NOT be castle or keep
            [not]
                terrain=C*,K*
            [/not]

            [filter_adjacent_location]
                [filter]
                    side=$side_number
                    canrecruit=yes

                    [filter_location]
                        terrain=Ce*^*
                    [/filter_location]
                [/filter]
            [/filter_adjacent_location]
        [/have_location]
    [/show_if]
    [command]
        [gold]
            side=$side_number
            amount=-8
        [/gold]
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            [set_variable]
                name=carrying_mining_equipment
                value=yes
            [/set_variable]
        [/modify_unit]
        {APPLY_MINING_EQUIPMENT}
    [/command]
[/set_menu_item]
#enddef

#define DROP_MINING_GEAR_MENU_ITEM
[set_menu_item]
    id=drop_mining_gear
    description=_ "Drop Mining Gear"
    [show_if]
        [have_unit]
            x,y=$x1,$y1
            [filter_wml]
                [variables]
                    carrying_mining_equipment=yes
                [/variables]
            [/filter_wml]
        [/have_unit]
    [/show_if]
    [command]
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            [clear_variable]
                name=carrying_mining_equipment
            [/clear_variable]
        [/modify_unit] 
        {REMOVE_MINING_EQUIPMENT}
    [/command]
[/set_menu_item]
#enddef

#define START_MINING_MENU_ITEM
[set_menu_item]
    id=start_mining
    description=_ "Start Mining"
    [show_if]
        [have_unit]
            x,y=$x1,$y1
            [filter_wml]
                [variables]
                    carrying_mining_equipment=yes
                [/variables]
            [/filter_wml]
        [/have_unit]
        [have_location]
            x,y=$x1,$y1

            # Selected tile must NOT be on any kind of rough terrain
            [not]
                terrain=C*,K*,^V*,W*,A*,S*,^B*
            [/not]
            #  terrain=G*,R*,I*,D*,H*,M*

            [filter_adjacent_location]
                terrain=C*,K*
            [/filter_adjacent_location]
        [/have_location]
    [/show_if]
    [command]
        {REMOVE_MINING_EQUIPMENT}
        [store_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            variable=stored_unit
            kill=yes
        [/store_unit] 
        [unit]
            type=SM_Mine
            x,y=$x1,$y1
            side=$side_number
        [/unit]
        [store_unit] 
            [filter]
                x,y=$x1,$y1
            [/filter]
            variable=replacement_unit
            kill=no
        [/store_unit]
        [set_variables]
            name=replacement_unit.variables.occupant
            to_variable=stored_unit
        [/set_variables]
        [set_variable]
            name=replacement_unit.variables.occupied_duration
            value=5
        [/set_variable]
        [unstore_unit]
            variable=replacement_unit 
            find_vacant=no
        [/unstore_unit] 
        [clear_variable]
            name=stored_unit
        [/clear_variable]
        [clear_variable]
            name=replacement_unit
        [/clear_variable]
    [/command]
[/set_menu_item]
#enddef

#define STOP_MINING_MENU_ITEM
[set_menu_item]
    id=stop_mining
    description=_ "stop mining"
    [show_if]
        [have_unit]
            x,y=$x1,$y1
            type=SM_Mine
        [/have_unit]
    [/show_if]
    [command]
        [store_unit] 
            [filter]
                x,y=$x1,$y1
            [/filter]
            variable=miner
            kill=no
        [/store_unit]
        [set_variable]
            name=occupant_id
            value=$miner.variables.occupant.id
        [/set_variable]
        [set_variable]
            name=transferred_damage
            formula="($miner.max_hitpoints - $miner.hitpoints) / 2"
        [/set_variable]
        [set_variables] 
            name=temp_occupant 
            to_variable=miner.variables.occupant
        [/set_variables]

        [kill]
            x,y=$x1,$y1
            fire_event=no
            animate=no
        [/kill]

        [unstore_unit] 
            variable=temp_occupant
            x,y=$x1,$y1
            find_vacant=no
        [/unstore_unit]

        [harm_unit]
            [filter]
                id=$occupant_id
            [/filter]
            amount=$transferred_damage
            animate=no
            kill=no
        [/harm_unit]

        [clear_variable]
            name=occupant_id
        [/clear_variable]
        [clear_variable] 
            name=transferred_damage
        [/clear_variable]
        [clear_variable]
            name=miner
        [/clear_variable]
    [/command]
[/set_menu_item]
#enddef
