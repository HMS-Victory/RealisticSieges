#define APPLY_MINING_EQUIPMENT
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "miningEquipment_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [lua]
        code=<<
            local u = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local ladder_moves = u.variables.max_moves / 2 +1
            wesnoth.set_variable("moves", ladder_moves)
        >>
    [/lua]
    [object]
        id=$objectId
        take_only_once=no
        silent=yes
        duration=scenario
        [filter] 
            x,y=$x1,$y1
        [/filter]
        [effect]
            apply_to=movement
            set=$moves
        [/effect]
    [/object]
    [clear_variable]
        name=moves
    [/clear_variable]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef

#define REMOVE_MINING_EQUIPMENT
    [lua]
        code = <<
            local unit = wesnoth.units.get(wml.variables["x1"], wml.variables["y1"])
            local raw_string = "miningEquipment_" .. unit.id
            local processed_string = raw_string:gsub("[%s-]+", "_")
            wesnoth.set_variable("objectId", processed_string)
        >>
    [/lua]
    [remove_object]
        [filter]
            x,y=$x1,$y1
        [/filter]
        object_id=$objectId
    [/remove_object]
    [modify_unit]
        [filter]
            x,y=$x1,$y1
        [/filter]
        [rebuild]
        [/rebuild]
    [/modify_unit]
    [clear_variable]
        name=objectId
    [/clear_variable]
#enddef