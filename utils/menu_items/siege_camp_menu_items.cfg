#define BUILD_SIEGE_CAMP_MENU_ITEM
 [set_menu_item]
    id=build_siege_camp
    description=_ "Build Siege Camp (cost: 14g & 2 turn penalty)"
    [show_if]
        [have_unit]
            x,y=$x1,$y1
            canrecruit=yes
            side=$side_number
        [/have_unit]
        [have_location]
            x,y=$x1,$y1

            terrain=G*,R*,I*,Ur*,D*,Uu*,Urb*

            [not] 
                [filter_adjacent_location]
                    terrain=C*^*,K*^*
                [/filter_adjacent_location]
            [/not]
        [/have_location]
    [/show_if]
    [command]
        [gold]
            side=$side_number
            amount=-14
        [/gold]
        {APPLY_OCCUPIED_EFFECT 2}
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            [set_variable]
                name=occupied_duration
                value=2
            [/set_variable]
            [set_variable]
                name=constructing_siege_camp
                value=yes
            [/set_variable]
        [/modify_unit]
    [/command]
[/set_menu_item]
#enddef