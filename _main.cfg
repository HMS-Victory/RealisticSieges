[binary_path]
   path=data/add-ons/Siege_Mod/
[/binary_path]
[textdomain]
    name="wesnoth-Siege_Mod"
    path="data/add-ons/Siege_Mod/translations"
[/textdomain]

#ifdef MULTIPLAYER
{~add-ons/Siege_Mod/images/terrain/gateStone/}
{~add-ons/Siege_Mod/images/terrain/bridgeStone}
{~add-ons/Siege_Mod/utils/}
{~add-ons/Siege_Mod/macros/}
{~add-ons/Siege_Mod/images/units/}
[+units]
    {~add-ons/Siege_Mod/units/}
[/units]


[lua]
    code = <<
        wesnoth.dofile("~add-ons/Siege_Mod/utils/lua/RSM_recruit.lua")
        wesnoth.dofile("~add-ons/Siege_Mod/utils/lua/RSM_knockback.lua")
    >>
[/lua]


#textdomain wesnoth-Siege_Mod
[modification]
    id=Siege_Mod  
    name=_ "Realistic Sieges"
    type=hybrid
    require_modification=yes
    description=_ "Applies real life principles like height to prevent soldiers outside a castle from just attacking the defenders with melee"



    [event] 
        name=prestart
        [set_menu_item]
            id=recruit_siege_machine
            description= _ "Recruit Siege Machine" 

            [show_if]
                [not]
                    [have_unit]
                        x,y=$x1,$y1
                    [/have_unit]
                [/not]
                [have_location]
                    x,y=$x1,$y1

                    # Selected tile must NOT be castle or keep
                    [not]
                        terrain=C*,K*
                    [/not]

                    # Selected tile must be adjacent to a leader on wooden castle
                    [filter_adjacent_location]
                        [filter]
                            side=$side_number
                            canrecruit=yes

                            [filter_location]
                                terrain=Ce*^*
                            [/filter_location]
                        [/filter]
                    [/filter_adjacent_location]
                [/have_location]
            [/show_if]

            [command]
                [RSM_recruit]
                    list = "SM_Catapult,SM_Battering_Ram"
                    to=chosenUnit
                [/RSM_recruit]
                [if]
                    [variable]
                        name=chosenUnit
                        exists=yes
                    [/variable]
                    [not]
                        [variable]
                            name=chosenUnit
                            equals=""
                        [/variable]
                    [/not]
                    [then] 
                        {RSM_MANUAL_RECRUIT $chosenUnit $side_number $x1 $y1}
                    [/then]
                [/if]
                [clear_variable]
                    name=chosenUnit
                [/clear_variable]
            [/command]
        [/set_menu_item]
        [set_menu_item]
            id=grant_ladder_ability
            description=_ "Equip unit with ladders (cost: 6g)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    [not]
                        [filter_wml]
                            [variables]
                                hasLadder=yes
                            [/variables]
                        [/filter_wml]  
                    [/not]
                    [not]
                        [filter_wml]  
                            [variables]
                                cannot_fly=no 
                            [/variables]
                        [/filter_wml]
                    [/not]
                [/have_unit]    

                [have_location]
                    x,y=$x1,$y1
 
                    [not]
                        terrain=C*,K*
                    [/not]
                    # Selected tile must be adjacent to a leader on wooden castle
                    [filter_adjacent_location]
                        [filter]
                            side=$side_number
                            canrecruit=yes

                            [filter_location]
                                terrain=Ce*^*
                            [/filter_location]
                        [/filter]
                    [/filter_adjacent_location]
                [/have_location] 
                #  only show up if there is a unit already standing on this tile
            [/show_if]
            [command]
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]

                    [set_variable]
                        name=hasLadder
                        value=yes 
                    [/set_variable]
                [/modify_unit]
                [gold]
                    side=$side_number
                    amount=-6
                [/gold]
                {REMOVE_ELEVATOR_COSTS}
                {REMOVE_RAMPART_COSTS}
                {REMOVE_GROUND_COSTS} 
                {APPLY_LADDER_TO_WALLS} 
                {castleZOC_OFF}
                {RESTORE_MOVES} 
            [/command]
        [/set_menu_item]
        [set_menu_item]
            id=remove_ladder_ability
            description=_ "Drop Ladders"
            [show_if]
                #  only show up if there is a unit already standing on this tile
                [have_unit]
                    x,y=$x1,$y1
                    [filter_wml]
                        [variables]
                            hasLadder=yes
                        [/variables]
                    [/filter_wml]
                [/have_unit] 
            [/show_if] 
            [command]
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]  
                    [clear_variable]
                        name=hasLadder
                    [/clear_variable]
                [/modify_unit]
                #  make sure we set movement costs to the terrain we currently stand on
                [if]
                    [have_location]
                        x,y=$x1,$y1
                        terrain="C*,K*"
                    [/have_location]
                    [then]
                        {castleZOC_ON}
                        {REMOVE_LADDER}
                        {REMOVE_GROUND_COSTS}
                        {REMOVE_ELEVATOR_COSTS}
                        {APPLY_RAMPART_COSTS}                
                        {DEFENSIVE_SIEGE_MACHINE}
                        {RESTORE_MOVES}
                    [/then]
                    [elseif]
                        [have_location]
                            x,y=$x1,$y1
                            terrain="K*^V*, C*^V*, Chg^*"
                        [/have_location]
                        [then]
                            {REMOVE_LADDER}
                            {castleZOC_OFF}
                            {REMOVE_GROUND_COSTS}
                            {REMOVE_RAMPART_COSTS}
                            {APPLY_ELEVATOR_COSTS}
                            {RESTORE_MOVES}
                        [/then]
                    [/elseif]
                    [else]
                        {REMOVE_LADDER}
                        {REMOVE_ELEVATOR_COSTS}
                        {REMOVE_RAMPART_COSTS}
                        {APPLY_GROUND_COSTS}
                        {castleZOC_OFF}
                        {RESTORE_MOVES}
                    [/else]
                [/if]
            [/command]
        [/set_menu_item]
        
        [set_menu_item]
            id=build_siege_camp
            description=_ "Build Siege Camp (cost: 14g & 2 turn penalty)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    canrecruit=yes
                    side=$side_number
                [/have_unit]
                [have_location]
                    x,y=$x1,$y1

                    # Selected tile must NOT be on any kind of rough terrain
                    #  [not]
                    #      [filter_location]
                    #          terrain=C*,K*,H*,M*,W*,U*,*^F*,*^V*,A*,S*
                    #      [/filter_location]
                    #  [/not] 
                    terrain=G*,R*,I*,Ur*,D*,Uu*,Urb*

                    [not] 
                        [filter_adjacent_location]
                            terrain=C*^*,K*^*
                        [/filter_adjacent_location]
                    [/not]
                [/have_location]
            [/show_if]
            [command]
                [gold]
                    side=$side_number
                    amount=-14
                [/gold]
                {APPLY_OCCUPIED_EFFECT 2}
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]
                    [set_variable]
                        name=occupied_duration
                        value=2
                    [/set_variable]
                    [set_variable]
                        name=constructing_siege_camp
                        value=yes
                    [/set_variable]
                [/modify_unit]
            [/command]
        [/set_menu_item]


        [set_menu_item]
            id=equip_mining_gear
            description=_ "Equip Mining Gear (Cost: 8g)"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    [filter_wml]
                        [modifications]
                            [trait]
                                id=siege_engineer
                            [/trait]
                        [/modifications]
                    [/filter_wml]
                    [not]
                        [filter_wml]
                            [variables]
                                carrying_mining_equipment=yes
                            [/variables]
                        [/filter_wml]  
                    [/not]
                    [not]
                        [filter_wml]  
                            [variables]
                                cannot_fly=no 
                            [/variables]
                        [/filter_wml]
                    [/not]
                [/have_unit]
                [have_location]
                    x,y=$x1,$y1

                    # Selected tile must NOT be castle or keep
                    [not]
                        terrain=C*,K*
                    [/not]

                    [filter_adjacent_location]
                        [filter]
                            side=$side_number
                            canrecruit=yes

                            [filter_location]
                                terrain=Ce*^*
                            [/filter_location]
                        [/filter]
                    [/filter_adjacent_location]
                [/have_location]
            [/show_if]
            [command]
                [gold]
                    side=$side_number
                    amount=-8
                [/gold]
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]
                    [set_variable]
                        name=carrying_mining_equipment
                        value=yes
                    [/set_variable]
                [/modify_unit]
                {APPLY_MINING_EQUIPMENT}
            [/command]
        [/set_menu_item]
        [set_menu_item]
            id=drop_mining_gear
            description=_ "Drop Mining Gear"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    [filter_wml]
                        [variables]
                            carrying_mining_equipment=yes
                        [/variables]
                    [/filter_wml]
                [/have_unit]
            [/show_if]
            [command]
                [modify_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]
                    [clear_variable]
                        name=carrying_mining_equipment
                    [/clear_variable]
                [/modify_unit] 
                {REMOVE_MINING_EQUIPMENT}
            [/command]
        [/set_menu_item]

        [set_menu_item]
            id=start_mining
            description=_ "Start Mining"
            [show_if]
                [have_unit]
                    x,y=$x1,$y1
                    [filter_wml]
                        [variables]
                            carrying_mining_equipment=yes
                        [/variables]
                    [/filter_wml]
                [/have_unit]
                [have_location]
                    x,y=$x1,$y1

                    # Selected tile must NOT be on any kind of rough terrain
                    [not]
                        terrain=C*,K*,^V*,W*,A*,S*,^B*
                    [/not]
                    #  terrain=G*,R*,I*,D*,H*,M*

                    [filter_adjacent_location]
                        terrain=C*,K*
                    [/filter_adjacent_location]
                [/have_location]
            [/show_if]
            [command]
                #  transforms the unit temporarily into another unit, we would
                #  need to store the unit, and place a mine on the terrain they used to stand on
                #  the mine should take between 4-6 turns to complete operations, halfway through all castles 
                #  that are in danger should be transformed into ruined castles, at the end of the 
                #  set of turns all affected castles should collapse into heaps of rubble
                #  allowing attackers to pour in
                #  when construction starts we want to remove the mining equipment variable
                {REMOVE_MINING_EQUIPMENT}
                [store_unit]
                    [filter]
                        x,y=$x1,$y1
                    [/filter]
                    variable=stored_unit
                    kill=yes
                [/store_unit]
                [unit]
                    type=SM_Mine
                    x,y=$x1,$y1
                    side=$side_number
                [/unit]
                [store_unit] 
                    [filter]
                        x,y=$x1,$y1
                    [/filter]
                    variable=replacement_unit
                    kill=no
                [/store_unit]
                [set_variables]
                    name=replacement_unit.variables.occupant
                    to_variable=stored_unit
                [/set_variables]
                [set_variable]
                    name=replacement_unit.variables.occupied_duration
                    value=5
                [/set_variable]
                [unstore_unit]
                    variable=replacement_unit 
                    find_vacant=no
                [/unstore_unit] 
                [clear_variable]
                    name=stored_unit
                [/clear_variable]
                [clear_variable]
                    name=replacement_unit
                [/clear_variable]
            [/command]
        [/set_menu_item] 
    [/event]

    [event]
        name=new turn
        first_time_only=no

        [lua]
            code= <<
                for _,u in ipairs(wesnoth.get_units {}) do
                    if not u.variables.occupied_duration then
                        goto continue
                    end

                    u.variables.occupied_duration = u.variables.occupied_duration - 1
                    if u.variables.occupied_duration <= 0 and u.variables.constructing_siege_camp then
                        local raw_string = "occupied_" .. u.id
                        local objectId = raw_string:gsub("[%s-]+", "_")

                        u.variables.occupied_duration = nil  
                        u.variables.constructing_siege_camp = nil
 
                        wesnoth.set_terrain(u.x, u.y, "Ce")  
                        wesnoth.wml_actions.remove_object {
                            id = u.id,
                            object_id = objectId
                        }
                        
                    elseif u.variables.occupied_duration <= 0 and u.type == "SM_Mine" then
                        local castles = {} 
                        
                        for adjacentX, adjacentY in wesnoth.current.map:iter_adjacent({u.x, u.y}, true) do
                            local terrain = wesnoth.current.map[{adjacentX, adjacentY}] 


                            if wesnoth.terrain_types[terrain].castle then
                                table.insert(castles, {x = adjacentX, y = adjacentY})
                            end
                        end  

                        wesnoth.wml_actions.sound {
                            name = "rumble.ogg"
                        }

                        for _, hex in ipairs(castles) do 
                            local roll = math.random(5)

                            -- check base terrains
                            if roll <= 2 then
                                wesnoth.set_terrain(hex.x, hex.y, "Rb")
                            elseif roll == 3 then
                                wesnoth.set_terrain(hex.x, hex.y, "Re")
                            elseif roll == 4 then
                                wesnoth.set_terrain(hex.x, hex.y, "Rd")
                            else
                                wesnoth.set_terrain(hex.x, hex.y, "Wwf")
                            end

                            -- check overlay terrains
                            if math.random(2) == 1 then
                                wesnoth.set_terrain(hex.x, hex.y, "^Dr")
                            end

                            local adjacentUnit = wesnoth.units.get(hex.x, hex.y)

                            if adjacentUnit then
                                local raw_string = "elevatorCosts_" .. u.id
                                local objectId = raw_string:gsub("[%s-]+", "_")
                                wesnoth.wml_actions.remove_object {
                                    id = u.id,
                                    object_id = objectId
                                }
                                raw_string = "rampartCosts_" .. u.id
                                objectId = raw_string:gsub("[%s-]+", "_")
                                wesnoth.wml_actions.remove_object {
                                    id = u.id,
                                    object_id = objectId
                                }

                                raw_string = "groundCosts_" .. u.id
                                objectId = raw_string:gsub("[%s-]+", "_")
                                wesnoth.wml_actions.object {
                                    id = objectId,
                                    take_only_once = false,
                                    silent = true,
                                    duration = "scenario", 

                                    { "filter", {
                                        x = adjacentUnit.x,
                                        y = adjacentUnit.y
                                    }},

                                    { "effect", {
                                        apply_to = "movement_costs",
                                        replace = true,

                                        { "movement_costs", { 
                                            castle = 99
                                        }} 
                                    }}
                                }


                                wesnoth.wml_actions.harm_unit { 
                                    amount = math.random(40 .. 100),
                                    animate = true,
                                    kill = true,
                                    { "filter", { x = hex.x, y = hex.y } }
                                }
                            end
                        end

                        local occupant = u.variables.occupant

                        if occupant then  
                            u:erase()
                            wesnoth.put_unit(occupant) 
                            goto continue
                        end
                    end   

 
                    u:extract()
                    u:to_map() 

                    ::continue::
                end
            >>
        [/lua]
    [/event]


    [event]
        name=exit_hex
        first_time_only=no
        #  this is meant to inform the restoreOriginalMoves macro
        #  each time a unit exits a hex we store it's current remaining moves-1
        #  of course depending on the terrain the unit steps on this is likely to be inacurate most of the time
        #  but since this is only implemented when a unit's movetype changes, and that particular terrain
        #  costs 1 movepoint regardless then when we actually use this variable it will be completely accurate.
        [set_variable]
            name=remaining_moves
            value="$($unit.moves - 1)"
        [/set_variable]
    [/event]

    #  #  fires when a unit teleports
    [event]
        name=enter_hex
        first_time_only=no
        [filter_condition]
            [have_location]
                x,y=$x2,$y2
                terrain=*^Tnl*
                [not]
                    [filter_adjacent_location]
                        x,y=$x1,$y1
                    [/filter_adjacent_location]
                [/not]
            [/have_location]
        [/filter_condition] 
            [modify_unit]
                [filter]
                    id=$unit.id
                [/filter]
                moves="$($unit.moves - 5)"
            [/modify_unit] 
    [/event]  

    [event]
        name=moveto
        first_time_only=no
        #  don't do anything at all to flying units
        [filter]
            [and]
                [filter_location]
                    x,y=$x1,$y1
                [/filter_location]

                formula = "self.movement_cost.unwalkable = null or self.movement_cost.unwalkable > self.max_moves" 
            [/and]
        [/filter]

        #  if standing on an elevator - grant elevator costs
        #  if standing on a rampart - grant rampart costs
        #  if standing on the ground grant ground costs
        [if]
            #  if the terrain is any type of castle
            [have_location]
                x,y=$x1,$y1
                terrain="C*,K*, K*^V*, C*^V*"
            [/have_location]
            [then]
                {HANDLE_WALL_LOGIC}
            [/then]
            [elseif]
                [have_location]
                    x,y=$x1,$y1
                    terrain="*^Tnl"
                [/have_location]
                [then]
                    #  only make changes because of the base terrain under the ^Tnl
                [/then]
            [/elseif] 
            [else]
                {HANDLE_GROUND_LOGIC}
            [/else]
        [/if]
        
        [clear_variable]
            name=remaining_moves
        [/clear_variable]
    [/event]



    #  do this for any unit anywhere, except for siege machines
    [event]
        name=unit_placed
        first_time_only=no
        [filter]
            x,y=$x1,$y1
            [not]
                race=mechanical
            [/not]
        [/filter]
        {APPLY_TUNNELING}
        #  {HANDLE_GATE_MOVEMENT}
    [/event]

    [event]
        name=unit_placed
        first_time_only=no
        [filter]
            [and]
                [filter_location]
                    x,y=$x1,$y1
                [/filter_location]

                [not]
                    [filter_wml]
                        [variables]
                            placed_first_time=yes 
                        [/variables] 
                    [/filter_wml]
                [/not]
                formula = "self.movement_cost.unwalkable = null or self.movement_cost.unwalkable > self.max_moves" 
            [/and]  
        [/filter]      
        
        [if]
            #  if the terrain is any type of castle
            [have_location]
                x,y=$x1,$y1
                terrain="C*,K*,K*^V*"
            [/have_location]
            
            [then]
                #  if the unit is both standing on the castle and can't fly
                {HANDLE_WALL_LOGIC}
                [if]
                    [have_unit]
                        x,y=$x1,$y1
                        [not]
                            type=SM_Catapult,SM_Battering_Ram
                        [/not]
                    [/have_unit]
                    [then]
                        {APPLY_CASTLE_MELEE}
                    [/then]
                [/if]
            [/then] 
            [elseif]
                [have_location]
                    x,y=$x1,$y1
                    terrain="*^Tnl"
                [/have_location]
                [then]
                    #  only make changes because of the base terrain under the ^Tnl
                [/then]
            [/elseif]  
            [else]
                {HANDLE_GROUND_LOGIC}
            [/else]
        [/if]
        [modify_unit]
            [filter]
                x,y=$x1,$y1
            [/filter]
            [set_variable]
                name=placed_first_time
                value=yes
            [/set_variable]
            [set_variable]
                name=max_moves
                value=$unit.max_moves
            [/set_variable]
            [set_variable]
                name=cannot_fly
                value=yes
            [/set_variable]
        [/modify_unit]
    [/event]

    [event]
        name=recruit
        first_time_only=no
        [filter]
            x,y=$x1,$y1
            [not]
                race=undead
            [/not] 
            [not]
                race=mechanical
            [/not]
        [/filter]
        {ADD_ENGINEER_TRAIT_TO_RECRUITED}
        [modify_unit]
            [filter]
                x,y=$x1,$y1
                formula = "self.movement_cost.unwalkable != null and self.movement_cost.unwalkable < self.max_moves"
            [/filter]
            [set_variable]
                name=cannot_fly
                value=no
            [/set_variable] 
        [/modify_unit]
    [/event]

    [event]
        name=attack end
        first_time_only=no

        [filter_attack]
            special_id=knockback
        [/filter_attack]
        [knockback]
            [filter]
                find_in=second_unit
            [/filter]
            [filter_second]
                find_in=unit
            [/filter_second]
        [/knockback]
    [/event]

    [event]
        name=die

        [filter]
            ability=vehicle
        [/filter]

        [foreach]
            array=unit.variables.occupant
            variable=unit

            [do]
                [unstore_unit]
                    variable=unit
                    x,y=$x1,$y1
                    find_vacant=yes
                [/unstore_unit]

                [kill]
                    id=$unit.id
                    animate=no
                    fire_event=yes
                [/kill]
            [/do]
        [/foreach]

    [/event]

[/modification]
#endif

#ifdef EDITOR
[binary_path]
   path=data/add-ons/Siege_Mod/
[/binary_path]
    {~add-ons/Siege_Mod/images/terrain/gateStone/}
    {~add-ons/Siege_Mod/images/terrain/bridgeStone/}
    {~add-ons/Siege_Mod/utils/}
