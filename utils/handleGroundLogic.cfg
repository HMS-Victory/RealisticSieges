#define HANDLE_GROUND_LOGIC
    [if]
        #  if the unit does not already have ground costs
        [not]
            [variable]
                name=unit.variables.currentMoveCosts
                contains="groundCosts_$unit.id" 
            [/variable]
        [/not]
        [then]
            [set_variable]
                name=unit.variables.currentMoveCosts
                value="groundCosts_$unit.id"
            [/set_variable]
            {APPLY_GROUND_COSTS}
            {REMOVE_ELEVATOR_COSTS}
            {REMOVE_RAMPART_COSTS}
            {castleZOC_OFF}
            {RESTORE_MOVES}

            [if]  
                [have_unit]
                    x,y=$x1,$y1
                    [filter_wml]
                        [variables]
                            hasLadder=yes 
                        [/variables] 
                    [/filter_wml]
                [/have_unit] 
                [then]
                    {REMOVE_LADDER}
                    {REMOVE_ELEVATOR_COSTS}
                    {REMOVE_RAMPART_COSTS}
                    {REMOVE_GROUND_COSTS} 
                    {APPLY_LADDER_TO_WALLS} 
                    {castleZOC_OFF}
                    {RESTORE_MOVES} 
                [/then]
            [/if]
        [/then]
    [/if]
#enddef